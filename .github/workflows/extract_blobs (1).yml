name: Extract Vendor Blobs

on:
  workflow_dispatch:
    inputs:
      DEVICE_PATH:
        description: 'Device codename (e.g. LXX525)'
        required: true
        default: 'LXX525'
      VENDOR_NAME:
        description: 'Vendor/brand folder name (e.g. lava)'
        required: true
        default: 'lava'

jobs:
  extract:
    name: Extract Blobs from Partitions
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Check Out
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils jq python3-pip unzip p7zip-full wget curl rsync

      - name: Download Partition Images from Release
        run: |
          mkdir -p images
          cd images
          
          echo "Downloading partition images from GitHub Release..."
          
          for part in vendor_a odm_dlkm_a system_ext_a; do
            echo "Downloading ${part}.img..."
            gh release download firmware --pattern "${part}.img" --dir . || \
            wget -q -O "${part}.img" "https://github.com/${{ github.repository }}/releases/download/firmware/${part}.img"
            
            if [ -f "${part}.img" ]; then
              echo "  ${part}.img: $(ls -lh ${part}.img | awk '{print $5}')"
            else
              echo "  WARNING: ${part}.img not found"
            fi
          done
          
          echo "=== Downloaded files ==="
          ls -lh *.img
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mount Partitions
        run: |
          sudo mkdir -p /mnt/vendor /mnt/vendor_dlkm /mnt/system_ext

          for part_info in "vendor_a:/mnt/vendor" "odm_dlkm_a:/mnt/vendor_dlkm" "system_ext_a:/mnt/system_ext"; do
            part=$(echo $part_info | cut -d: -f1)
            mnt=$(echo $part_info | cut -d: -f2)
            
            if [ -f images/${part}.img ]; then
              echo "Mounting $part to $mnt..."
              
              sudo mount -t erofs -o ro,loop images/${part}.img $mnt 2>/dev/null
              if [ $? -ne 0 ]; then
                sudo mount -t ext4 -o ro,loop images/${part}.img $mnt 2>/dev/null
              fi
              if [ $? -ne 0 ]; then
                sudo mount -o ro,loop images/${part}.img $mnt 2>/dev/null
              fi
              
              echo "  $part contents:"
              ls $mnt | head -10
            fi
          done

      - name: Extract Blobs
        run: |
          set +e
          DEVICE="${{ github.event.inputs.DEVICE_PATH }}"
          VENDOR="${{ github.event.inputs.VENDOR_NAME }}"
          OUTDIR="vendor_blobs/$VENDOR/$DEVICE"

          mkdir -p "$OUTDIR"

          echo "=========================================="
          echo "Extracting blobs to $OUTDIR"
          echo "=========================================="

          # HAL binaries - need sudo because bin/ has restricted permissions
          echo ">>> vendor/bin/ (with sudo) ..."
          if [ -d /mnt/vendor/bin ]; then
            mkdir -p "$OUTDIR/bin"
            sudo rsync -aL /mnt/vendor/bin/ "$OUTDIR/bin/" 2>/dev/null
            sudo chown -R runner:runner "$OUTDIR/bin/" 2>/dev/null
            echo "  Binaries: $(find "$OUTDIR/bin" -type f 2>/dev/null | wc -l)"
            echo "  HAL binaries in bin/hw/: $(ls "$OUTDIR/bin/hw/" 2>/dev/null | wc -l)"
          fi

          # Vendor libraries
          echo ">>> vendor/lib/ and vendor/lib64/ ..."
          for libdir in lib lib64; do
            if [ -d /mnt/vendor/$libdir ]; then
              mkdir -p "$OUTDIR/$libdir"
              sudo rsync -aL /mnt/vendor/$libdir/ "$OUTDIR/$libdir/" 2>/dev/null
              sudo chown -R runner:runner "$OUTDIR/$libdir/" 2>/dev/null
              echo "  $libdir: $(find "$OUTDIR/$libdir" -name "*.so" 2>/dev/null | wc -l) libraries"
            fi
          done

          # Firmware - Lava puts it in /firmware/ not /etc/firmware/
          echo ">>> vendor/firmware/ ..."
          if [ -d /mnt/vendor/firmware ]; then
            mkdir -p "$OUTDIR/firmware"
            sudo rsync -aL /mnt/vendor/firmware/ "$OUTDIR/firmware/" 2>/dev/null
            sudo chown -R runner:runner "$OUTDIR/firmware/" 2>/dev/null
            echo "  Firmware files: $(ls "$OUTDIR/firmware/" 2>/dev/null | wc -l)"
          fi

          # Also check etc/firmware just in case
          echo ">>> vendor/etc/firmware/ ..."
          if [ -d /mnt/vendor/etc/firmware ]; then
            mkdir -p "$OUTDIR/etc/firmware"
            sudo rsync -aL /mnt/vendor/etc/firmware/ "$OUTDIR/etc/firmware/" 2>/dev/null
            sudo chown -R runner:runner "$OUTDIR/etc/firmware/" 2>/dev/null
          fi

          # VINTF manifests
          echo ">>> vendor/etc/vintf/ ..."
          if [ -d /mnt/vendor/etc/vintf ]; then
            mkdir -p "$OUTDIR/etc/vintf"
            sudo rsync -aL /mnt/vendor/etc/vintf/ "$OUTDIR/etc/vintf/" 2>/dev/null
            sudo chown -R runner:runner "$OUTDIR/etc/vintf/" 2>/dev/null
          fi

          # Init scripts
          echo ">>> vendor/etc/init/ ..."
          if [ -d /mnt/vendor/etc/init ]; then
            mkdir -p "$OUTDIR/etc/init"
            sudo rsync -aL /mnt/vendor/etc/init/ "$OUTDIR/etc/init/" 2>/dev/null
            sudo chown -R runner:runner "$OUTDIR/etc/init/" 2>/dev/null
            echo "  Init scripts: $(ls "$OUTDIR/etc/init/" 2>/dev/null | wc -l)"
          fi

          # Audio configs
          echo ">>> Audio configs ..."
          for cfg in audio_device.xml audio_policy_configuration.xml audio_policy_volumes.xml audio_effects.xml audio_policy.conf; do
            sudo cp -L /mnt/vendor/etc/$cfg "$OUTDIR/etc/" 2>/dev/null
          done
          for dir in audio_param params audio; do
            if [ -d /mnt/vendor/etc/$dir ]; then
              mkdir -p "$OUTDIR/etc/$dir"
              sudo rsync -aL /mnt/vendor/etc/$dir/ "$OUTDIR/etc/$dir/" 2>/dev/null
              sudo chown -R runner:runner "$OUTDIR/etc/$dir/" 2>/dev/null
            fi
          done

          # Media configs
          echo ">>> Media configs ..."
          for cfg in media_codecs.xml media_codecs_mediatek_audio.xml media_codecs_mediatek_video.xml media_codecs_performance.xml media_profiles.xml; do
            sudo cp -L /mnt/vendor/etc/$cfg "$OUTDIR/etc/" 2>/dev/null
          done

          # Sensor configs
          echo ">>> Sensor configs ..."
          for cfg in sensor_config.json sensorlist.txt; do
            sudo cp -L /mnt/vendor/etc/$cfg "$OUTDIR/etc/" 2>/dev/null
          done

          # GPS configs
          echo ">>> GPS configs ..."
          for cfg in gps.conf gps_param.xml agps_profiles_conf2.xml MNL_Config.xml; do
            sudo cp -L /mnt/vendor/etc/$cfg "$OUTDIR/etc/" 2>/dev/null
          done

          # Thermal configs
          echo ">>> Thermal configs ..."
          for cfg in thermal_info_config.json thermaloffset.cfg; do
            sudo cp -L /mnt/vendor/etc/$cfg "$OUTDIR/etc/" 2>/dev/null
          done

          # WiFi configs
          echo ">>> WiFi configs ..."
          if [ -d /mnt/vendor/etc/wifi ]; then
            mkdir -p "$OUTDIR/etc/wifi"
            sudo rsync -aL /mnt/vendor/etc/wifi/ "$OUTDIR/etc/wifi/" 2>/dev/null
            sudo chown -R runner:runner "$OUTDIR/etc/wifi/" 2>/dev/null
          fi
          # Also check etc/wpa (Lava uses wpa)
          if [ -d /mnt/vendor/etc/wpa ]; then
            mkdir -p "$OUTDIR/etc/wpa"
            sudo rsync -aL /mnt/vendor/etc/wpa/ "$OUTDIR/etc/wpa/" 2>/dev/null
            sudo chown -R runner:runner "$OUTDIR/etc/wpa/" 2>/dev/null
          fi

          # Permissions
          echo ">>> Vendor permissions ..."
          if [ -d /mnt/vendor/etc/permissions ]; then
            mkdir -p "$OUTDIR/etc/permissions"
            sudo rsync -aL /mnt/vendor/etc/permissions/ "$OUTDIR/etc/permissions/" 2>/dev/null
            sudo chown -R runner:runner "$OUTDIR/etc/permissions/" 2>/dev/null
          fi

          # RIL configs
          echo ">>> RIL configs ..."
          if [ -d /mnt/vendor/etc/ril ]; then
            mkdir -p "$OUTDIR/etc/ril"
            sudo rsync -aL /mnt/vendor/etc/ril/ "$OUTDIR/etc/ril/" 2>/dev/null
          fi

          # Camera configs
          echo ">>> Camera configs ..."
          if [ -d /mnt/vendor/etc/camera ]; then
            mkdir -p "$OUTDIR/etc/camera"
            sudo rsync -aL /mnt/vendor/etc/camera/ "$OUTDIR/etc/camera/" 2>/dev/null
            sudo chown -R runner:runner "$OUTDIR/etc/camera/" 2>/dev/null
          fi

          # TEE trusted apps - Lava uses TrustKernel, apps in /app/t6/
          echo ">>> TEE trusted apps (app/t6/) ..."
          if [ -d /mnt/vendor/app/t6 ]; then
            mkdir -p "$OUTDIR/app/t6"
            sudo rsync -aL /mnt/vendor/app/t6/ "$OUTDIR/app/t6/" 2>/dev/null
            sudo chown -R runner:runner "$OUTDIR/app/t6/" 2>/dev/null
            echo "  TA files: $(find "$OUTDIR/app/t6" -name "*.ta" 2>/dev/null | wc -l)"
          fi

          # vendor_dlkm
          echo ">>> vendor_dlkm ..."
          if [ -d /mnt/vendor_dlkm ]; then
            mkdir -p "$OUTDIR/vendor_dlkm"
            sudo rsync -aL /mnt/vendor_dlkm/ "$OUTDIR/vendor_dlkm/" 2>/dev/null
            sudo chown -R runner:runner "$OUTDIR/vendor_dlkm/" 2>/dev/null
            echo "  Kernel modules: $(find "$OUTDIR/vendor_dlkm" -name "*.ko" 2>/dev/null | wc -l)"
          fi

          # system_ext blobs
          echo ">>> system_ext blobs ..."
          if [ -d /mnt/system_ext ]; then
            for libdir in lib lib64; do
              if [ -d /mnt/system_ext/$libdir ]; then
                mkdir -p "$OUTDIR/system_ext/$libdir"
                sudo rsync -aL /mnt/system_ext/$libdir/ "$OUTDIR/system_ext/$libdir/" 2>/dev/null
                sudo chown -R runner:runner "$OUTDIR/system_ext/$libdir/" 2>/dev/null
              fi
            done
            if [ -d /mnt/system_ext/etc ]; then
              mkdir -p "$OUTDIR/system_ext/etc"
              sudo rsync -aL /mnt/system_ext/etc/ "$OUTDIR/system_ext/etc/" 2>/dev/null
              sudo chown -R runner:runner "$OUTDIR/system_ext/etc/" 2>/dev/null
            fi
          fi

          # build.prop
          echo ">>> build.prop ..."
          sudo cp -L /mnt/vendor/build.prop "$OUTDIR/" 2>/dev/null
          sudo chown runner:runner "$OUTDIR/build.prop" 2>/dev/null

          # Clean up any mnt directories
          rm -rf "$OUTDIR/mnt" 2>/dev/null

          # Generate proprietary-files.txt
          echo ">>> Generating proprietary-files.txt ..."
          cd "vendor_blobs/$VENDOR/$DEVICE"
          find . -type f | sed 's|^\./||' | sort > ../../../proprietary-files.txt
          echo "Total blobs: $(wc -l < ../../../proprietary-files.txt)"

          # Generate vendor makefile
          {
            echo "# SPDX-FileCopyrightText: 2024 The LineageOS Project"
            echo "# SPDX-License-Identifier: Apache-2.0"
            echo ""
            echo "PRODUCT_PACKAGES += \\"
            echo "    $DEVICE-vendor"
          } > ../../../"$DEVICE-vendor.mk"

          echo ""
          echo "=========================================="
          echo "EXTRACTION COMPLETE"
          echo "=========================================="
          echo "Total extracted files: $(find "$OUTDIR" -type f | wc -l)"
          echo "Total size: $(du -sh "$OUTDIR" | cut -f1)"
          echo ""
          echo "Directory structure:"
          find "$OUTDIR" -maxdepth 2 -type d | head -20
          echo ""
          echo "proprietary-files.txt entries: $(wc -l < ../../../proprietary-files.txt)"
          echo "First 30 entries:"
          head -30 ../../../proprietary-files.txt

      - name: Unmount Partitions
        if: always()
        run: |
          for mnt in /mnt/vendor /mnt/vendor_dlkm /mnt/system_ext; do
            sudo umount $mnt 2>/dev/null || true
          done

      - name: Create Vendor Repo Zip
        run: |
          cd vendor_blobs
          zip -r ../vendor_${{ github.event.inputs.DEVICE_PATH }}.zip .
          ls -lh ../vendor_${{ github.event.inputs.DEVICE_PATH }}.zip

      - name: Upload Vendor Blobs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor_${{ github.event.inputs.DEVICE_PATH }}
          path: vendor_${{ github.event.inputs.DEVICE_PATH }}.zip
          retention-days: 30

      - name: Upload proprietary-files.txt
        uses: actions/upload-artifact@v4
        with:
          name: proprietary_files_${{ github.event.inputs.DEVICE_PATH }}
          path: proprietary-files.txt
          retention-days: 30

      - name: Upload vendor.mk
        uses: actions/upload-artifact@v4
        with:
          name: vendor_mk_${{ github.event.inputs.DEVICE_PATH }}
          path: ${{ github.event.inputs.DEVICE_PATH }}-vendor.mk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            vendor_${{ github.event.inputs.DEVICE_PATH }}.zip
            proprietary-files.txt
            ${{ github.event.inputs.DEVICE_PATH }}-vendor.mk
          name: Vendor blobs for ${{ github.event.inputs.VENDOR_NAME }} ${{ github.event.inputs.DEVICE_PATH }}
          tag_name: blobs-${{ github.event.inputs.DEVICE_PATH }}-${{ github.run_id }}
          body: |
            ## Vendor blobs for ${{ github.event.inputs.VENDOR_NAME }} ${{ github.event.inputs.DEVICE_PATH }}

            Extracted from stock firmware partition images.

            ### Contents:
            - `vendor_${{ github.event.inputs.DEVICE_PATH }}.zip` — All vendor blobs
            - `proprietary-files.txt` — File list
            - `${{ github.event.inputs.DEVICE_PATH }}-vendor.mk` — Vendor makefile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

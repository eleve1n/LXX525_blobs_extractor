name: Extract Vendor Blobs

on:
  workflow_dispatch:
    inputs:
      FIRMWARE_URL:
        description: 'Gofile.io URL or direct download URL'
        required: true
        default: 'https://gofile.io/d/4NhqkKso'
      DEVICE_PATH:
        description: 'Device codename (e.g. LXX525)'
        required: true
        default: 'LXX525'
      VENDOR_NAME:
        description: 'Vendor/brand folder name (e.g. lava)'
        required: true
        default: 'lava'

jobs:
  extract:
    name: Extract Blobs from Firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Check Out
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils erofs-utils jq python3-pip unzip p7zip-full wget curl
          pip3 install requests
          wget -q -O /usr/local/bin/lpunpack https://raw.githubusercontent.com/unix3dgforce/lpunpack/master/lpunpack.py
          chmod +x /usr/local/bin/lpunpack

      - name: Download Firmware
        env:
          FIRMWARE_URL: ${{ github.event.inputs.FIRMWARE_URL }}
        run: |
          mkdir -p firmware
          cd firmware

          # Write Python download script
          cat > download_gofile.py << 'SCRIPT'
          import requests
          import json
          import sys
          import re
          import os

          url = os.environ.get("FIRMWARE_URL", "")
          print(f"Downloading from: {url}")

          # Extract content ID from gofile URL
          content_id = None
          if "/d/" in url:
              content_id = url.split("/d/")[-1].split("/")[0].split("?")[0]
          elif "?c=" in url:
              content_id = url.split("?c=")[-1].split("&")[0]

          if content_id:
              print(f"Gofile content ID: {content_id}")

              # Create guest account
              print("Creating guest account...")
              resp = requests.post("https://api.gofile.io/accounts", headers={"Accept": "application/json"})
              guest_data = resp.json()
              token = guest_data.get("data", {}).get("token", "")
              print(f"Guest token: {token}")

              # Try getting content with guest token
              headers = {
                  "Accept": "application/json",
                  "Authorization": f"Bearer {token}"
              }
              resp = requests.get(f"https://api.gofile.io/contents/{content_id}", headers=headers)
              data = resp.json()
              print(f"API response status: {data.get('status')}")

              if data.get("status") != "ok":
                  # Try scraping the website page for wt token
                  print("Trying website scraping for token...")
                  resp2 = requests.get(f"https://gofile.io/d/{content_id}")
                  wt_match = re.search(r'wt:\s*"([^"]+)"', resp2.text)
                  if wt_match:
                      wt = wt_match.group(1)
                      print(f"Found website token: {wt}")
                      resp = requests.get(f"https://api.gofile.io/contents/{content_id}?wt={wt}", headers=headers)
                      data = resp.json()
                      print(f"API response status: {data.get('status')}")
                  else:
                      resp = requests.get(f"https://api.gofile.io/contents/{content_id}?wt=4f6")
                      data = resp.json()
                      print(f"API response status (no auth): {data.get('status')}")

              if data.get("status") == "ok":
                  content_data = data.get("data", {})
                  download_url = None

                  if "link" in content_data:
                      download_url = content_data["link"]
                  elif "downloadPage" in content_data:
                      download_url = content_data["downloadPage"]

                  if not download_url and "children" in content_data:
                      for child_id, child in content_data["children"].items():
                          if "link" in child:
                              download_url = child["link"]
                              print(f"Found file: {child.get('name', 'unknown')}")
                              break

                  if download_url:
                      print(f"Download URL: {download_url}")
                      print("Downloading (this may take a while for large files)...")
                      resp = requests.get(download_url, stream=True, allow_redirects=True)
                      total = int(resp.headers.get('content-length', 0))
                      downloaded = 0
                      with open("firmware_download", "wb") as f:
                          for chunk in resp.iter_content(chunk_size=1024*1024):
                              if chunk:
                                  f.write(chunk)
                                  downloaded += len(chunk)
                                  if total > 0:
                                      pct = (downloaded / total) * 100
                                      print(f"\r  {downloaded/(1024*1024):.1f} MB / {total/(1024*1024):.1f} MB ({pct:.1f}%)", end="", flush=True)
                      print("\nDownload complete!")
                  else:
                      print(f"Could not find download URL in API response")
                      print(json.dumps(content_data, indent=2)[:1000])
                      sys.exit(1)
              else:
                  print(f"API error: {data}")
                  sys.exit(1)
          else:
              # Direct download URL
              print(f"Direct download: {url}")
              resp = requests.get(url, stream=True, allow_redirects=True)
              with open("firmware_download", "wb") as f:
                  for chunk in resp.iter_content(chunk_size=1024*1024):
                      if chunk:
                          f.write(chunk)
              print("Download complete!")

          # Verify
          size = os.path.getsize("firmware_download")
          print(f"File size: {size / (1024*1024):.1f} MB")
          if size < 1024:
              print("ERROR: File too small, download likely failed")
              sys.exit(1)
          SCRIPT

          python3 download_gofile.py

          echo "Downloaded file:"
          ls -lh firmware_download
          file firmware_download

      - name: Extract Archive
        run: |
          cd firmware
          if file firmware_download | grep -qi "zip"; then
            echo "Extracting ZIP..."
            unzip -o firmware_download
            rm firmware_download
          elif file firmware_download | grep -qi "rar"; then
            echo "Extracting RAR..."
            7z x firmware_download
            rm firmware_download
          elif file firmware_download | grep -qi "7z"; then
            echo "Extracting 7z..."
            7z x firmware_download
            rm firmware_download
          else
            echo "Not an archive, assuming raw images..."
            mv firmware_download super.img
          fi

          echo "=== Files in firmware directory ==="
          find . -maxdepth 1 -type f -exec ls -lh {} \;

          SUPER_IMG=$(find . -name "super.img" | head -1)
          if [ -z "$SUPER_IMG" ]; then
            echo "::error::super.img not found in firmware dump"
            echo "Available files:"
            find . -name "*.img" -exec ls -lh {} \;
            exit 1
          fi
          echo "Found super.img at: $SUPER_IMG"

      - name: Unpack Super Partition
        run: |
          mkdir -p super_out
          SUPER_IMG=$(find firmware -name "super.img" | head -1)
          echo "Converting super.img..."
          simg2img "$SUPER_IMG" super_out/super_raw.img 2>/dev/null || cp "$SUPER_IMG" super_out/super_raw.img
          echo "Unpacking super partition..."
          cd super_out
          lpunpack super_raw.img
          rm super_raw.img
          echo "=== Unpacked partitions ==="
          ls -lh *.img

      - name: Mount Partitions
        run: |
          mkdir -p /mnt/vendor /mnt/odm /mnt/system /mnt/product /mnt/system_ext /mnt/vendor_dlkm

          for part in vendor odm vendor_dlkm; do
            if [ -f super_out/$part.img ]; then
              echo "Mounting $part (erofs)..."
              sudo mount -t erofs -o ro,loop super_out/$part.img /mnt/$part 2>/dev/null || \
              sudo mount -o ro,loop super_out/$part.img /mnt/$part
              echo "$part contents:"
              ls /mnt/$part | head -5
            fi
          done

          for part in system product system_ext; do
            if [ -f super_out/$part.img ]; then
              echo "Mounting $part..."
              sudo mount -t ext4 -o ro,loop super_out/$part.img /mnt/$part 2>/dev/null || \
              sudo mount -o ro,loop super_out/$part.img /mnt/$part
              echo "$part contents:"
              ls /mnt/$part | head -5
            fi
          done

      - name: Extract Blobs
        run: |
          DEVICE="${{ github.event.inputs.DEVICE_PATH }}"
          VENDOR="${{ github.event.inputs.VENDOR_NAME }}"
          OUTDIR="vendor_blobs/$VENDOR/$DEVICE"

          mkdir -p "$OUTDIR"

          echo "=========================================="
          echo "Extracting blobs to $OUTDIR"
          echo "=========================================="

          echo ">>> Extracting vendor/bin/hw/ ..."
          if [ -d /mnt/vendor/bin/hw ]; then
            mkdir -p "$OUTDIR/bin/hw"
            cp -a /mnt/vendor/bin/hw/* "$OUTDIR/bin/hw/" 2>/dev/null
            echo "  HAL binaries: $(ls "$OUTDIR/bin/hw/" | wc -l)"
          fi

          echo ">>> Extracting vendor/bin/ ..."
          if [ -d /mnt/vendor/bin ]; then
            mkdir -p "$OUTDIR/bin"
            for bin in tee-supplicant miteelog mtkfusionrild fuelgauged fuelgauged_nvram; do
              if [ -f /mnt/vendor/bin/$bin ]; then
                cp /mnt/vendor/bin/$bin "$OUTDIR/bin/"
              fi
            done
          fi

          echo ">>> Extracting vendor/lib/ and vendor/lib64/ ..."
          for libdir in lib lib64; do
            if [ -d /mnt/vendor/$libdir ]; then
              mkdir -p "$OUTDIR/$libdir"
              find /mnt/vendor/$libdir -name "*.so" -exec cp --parents {} "$OUTDIR/" \; 2>/dev/null
              echo "  $libdir: $(find "$OUTDIR/$libdir" -name "*.so" | wc -l) libraries"
            fi
          done

          echo ">>> Extracting vendor/etc/firmware/ ..."
          if [ -d /mnt/vendor/etc/firmware ]; then
            mkdir -p "$OUTDIR/etc/firmware"
            cp -a /mnt/vendor/etc/firmware/* "$OUTDIR/etc/firmware/" 2>/dev/null
            echo "  Firmware files: $(ls "$OUTDIR/etc/firmware/" | wc -l)"
          fi

          echo ">>> Extracting vendor/etc/vintf/ ..."
          if [ -d /mnt/vendor/etc/vintf ]; then
            mkdir -p "$OUTDIR/etc/vintf"
            cp -a /mnt/vendor/etc/vintf/* "$OUTDIR/etc/vintf/" 2>/dev/null
          fi

          echo ">>> Extracting audio configs ..."
          for cfg in audio_device.xml audio_policy_configuration.xml audio_policy_volumes.xml; do
            if [ -f /mnt/vendor/etc/$cfg ]; then
              cp /mnt/vendor/etc/$cfg "$OUTDIR/etc/"
            fi
          done
          for dir in audio_param params; do
            if [ -d /mnt/vendor/etc/$dir ]; then
              mkdir -p "$OUTDIR/etc/$dir"
              cp -a /mnt/vendor/etc/$dir/* "$OUTDIR/etc/$dir/" 2>/dev/null
            fi
          done

          echo ">>> Extracting media configs ..."
          for cfg in media_codecs.xml media_codecs_mediatek_audio.xml media_codecs_mediatek_video.xml media_codecs_performance.xml media_profiles.xml; do
            if [ -f /mnt/vendor/etc/$cfg ]; then
              cp /mnt/vendor/etc/$cfg "$OUTDIR/etc/"
            fi
          done

          echo ">>> Extracting sensor configs ..."
          for cfg in sensor_config.json sensorlist.txt; do
            if [ -f /mnt/vendor/etc/$cfg ]; then
              cp /mnt/vendor/etc/$cfg "$OUTDIR/etc/"
            fi
          done

          echo ">>> Extracting GPS configs ..."
          for cfg in gps.conf gps_param.xml agps_profiles_conf2.xml; do
            if [ -f /mnt/vendor/etc/$cfg ]; then
              cp /mnt/vendor/etc/$cfg "$OUTDIR/etc/"
            fi
          done

          echo ">>> Extracting thermal configs ..."
          for cfg in thermal_info_config.json thermaloffset.cfg; do
            if [ -f /mnt/vendor/etc/$cfg ]; then
              cp /mnt/vendor/etc/$cfg "$OUTDIR/etc/"
            fi
          done

          echo ">>> Extracting WiFi configs ..."
          if [ -d /mnt/vendor/etc/wifi ]; then
            mkdir -p "$OUTDIR/etc/wifi"
            cp -a /mnt/vendor/etc/wifi/* "$OUTDIR/etc/wifi/" 2>/dev/null
          fi

          echo ">>> Extracting vendor permissions ..."
          if [ -d /mnt/vendor/etc/permissions ]; then
            mkdir -p "$OUTDIR/etc/permissions"
            cp -a /mnt/vendor/etc/permissions/* "$OUTDIR/etc/permissions/" 2>/dev/null
          fi

          echo ">>> Extracting RIL configs ..."
          if [ -d /mnt/vendor/etc/ril ]; then
            mkdir -p "$OUTDIR/etc/ril"
            cp -a /mnt/vendor/etc/ril/* "$OUTDIR/etc/ril/" 2>/dev/null
          fi

          echo ">>> Extracting TEE/MiTEE trusted apps ..."
          if [ -d /mnt/vendor/mitee ]; then
            mkdir -p "$OUTDIR/mitee"
            cp -a /mnt/vendor/mitee/* "$OUTDIR/mitee/" 2>/dev/null
            echo "  TA files: $(find "$OUTDIR/mitee" -name "*.ta" | wc -l)"
          fi

          echo ">>> Extracting camera configs ..."
          if [ -d /mnt/vendor/etc/camera ]; then
            mkdir -p "$OUTDIR/etc/camera"
            cp -a /mnt/vendor/etc/camera/* "$OUTDIR/etc/camera/" 2>/dev/null
          fi

          echo ">>> Extracting ODM blobs ..."
          if [ -d /mnt/odm ]; then
            for libdir in lib lib64; do
              if [ -d /mnt/odm/$libdir ]; then
                mkdir -p "$OUTDIR/odm/$libdir"
                find /mnt/odm/$libdir -name "*.so" -exec cp --parents {} "$OUTDIR/odm/" \; 2>/dev/null
              fi
            done
            if [ -d /mnt/odm/bin/hw ]; then
              mkdir -p "$OUTDIR/odm/bin/hw"
              cp -a /mnt/odm/bin/hw/* "$OUTDIR/odm/bin/hw/" 2>/dev/null
            fi
            if [ -d /mnt/odm/etc/vintf ]; then
              mkdir -p "$OUTDIR/odm/etc/vintf"
              cp -a /mnt/odm/etc/vintf/* "$OUTDIR/odm/etc/vintf/" 2>/dev/null
            fi
            if [ -d /mnt/odm/etc ]; then
              mkdir -p "$OUTDIR/odm/etc"
              cp -a /mnt/odm/etc/*.xml "$OUTDIR/odm/etc/" 2>/dev/null
              cp -a /mnt/odm/etc/*.json "$OUTDIR/odm/etc/" 2>/dev/null
            fi
          fi

          echo ">>> Extracting vendor_dlkm kernel modules ..."
          if [ -d /mnt/vendor_dlkm ]; then
            mkdir -p "$OUTDIR/vendor_dlkm"
            find /mnt/vendor_dlkm -name "*.ko" -exec cp --parents {} "$OUTDIR/vendor_dlkm/" \; 2>/dev/null
            echo "  Kernel modules: $(find "$OUTDIR/vendor_dlkm" -name '*.ko' | wc -l)"
            find /mnt/vendor_dlkm -name "modules.load" -exec cp --parents {} "$OUTDIR/vendor_dlkm/" \; 2>/dev/null
            find /mnt/vendor_dlkm -name "*.modules.load" -exec cp --parents {} "$OUTDIR/vendor_dlkm/" \; 2>/dev/null
          fi

          echo ">>> Extracting system_ext blobs ..."
          if [ -d /mnt/system_ext ]; then
            for libdir in lib lib64; do
              if [ -d /mnt/system_ext/$libdir ]; then
                mkdir -p "$OUTDIR/system_ext/$libdir"
                find /mnt/system_ext/$libdir -name "*.so" -exec cp --parents {} "$OUTDIR/system_ext/" \; 2>/dev/null
              fi
            done
            if [ -d /mnt/system_ext/etc ]; then
              mkdir -p "$OUTDIR/system_ext/etc"
              cp -a /mnt/system_ext/etc/*.xml "$OUTDIR/system_ext/etc/" 2>/dev/null
            fi
          fi

          echo ">>> Generating proprietary-files.txt ..."
          cd "vendor_blobs/$VENDOR/$DEVICE"
          find . -type f | sed 's|^\./||' | sort > ../../../proprietary-files.txt
          echo "Total blobs: $(wc -l < ../../../proprietary-files.txt)"

          echo ">>> Generating vendor makefile ..."
          {
            echo "# SPDX-FileCopyrightText: 2024 The LineageOS Project"
            echo "# SPDX-License-Identifier: Apache-2.0"
            echo ""
            echo "PRODUCT_PACKAGES += \\"
            echo "    $DEVICE-vendor"
          } > ../../../"$DEVICE-vendor.mk"

          echo ""
          echo "=========================================="
          echo "EXTRACTION COMPLETE"
          echo "=========================================="
          echo "Total extracted files: $(find "$OUTDIR" -type f | wc -l)"
          echo "Total size: $(du -sh "$OUTDIR" | cut -f1)"
          echo ""
          echo "Directory structure:"
          find "$OUTDIR" -maxdepth 2 -type d | head -20
          echo ""
          echo "proprietary-files.txt entries: $(wc -l < ../../../proprietary-files.txt)"
          echo "First 20 entries:"
          head -20 ../../../proprietary-files.txt

      - name: Unmount Partitions
        if: always()
        run: |
          for mnt in /mnt/vendor /mnt/odm /mnt/system /mnt/product /mnt/system_ext /mnt/vendor_dlkm; do
            sudo umount $mnt 2>/dev/null || true
          done

      - name: Create Vendor Repo Zip
        run: |
          cd vendor_blobs
          zip -r ../vendor_${{ github.event.inputs.DEVICE_PATH }}.zip .
          ls -lh ../vendor_${{ github.event.inputs.DEVICE_PATH }}.zip

      - name: Upload Vendor Blobs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor_${{ github.event.inputs.DEVICE_PATH }}
          path: vendor_${{ github.event.inputs.DEVICE_PATH }}.zip
          retention-days: 30

      - name: Upload proprietary-files.txt
        uses: actions/upload-artifact@v4
        with:
          name: proprietary_files_${{ github.event.inputs.DEVICE_PATH }}
          path: proprietary-files.txt
          retention-days: 30

      - name: Upload vendor.mk
        uses: actions/upload-artifact@v4
        with:
          name: vendor_mk_${{ github.event.inputs.DEVICE_PATH }}
          path: ${{ github.event.inputs.DEVICE_PATH }}-vendor.mk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            vendor_${{ github.event.inputs.DEVICE_PATH }}.zip
            proprietary-files.txt
            ${{ github.event.inputs.DEVICE_PATH }}-vendor.mk
          name: Vendor blobs for ${{ github.event.inputs.VENDOR_NAME }} ${{ github.event.inputs.DEVICE_PATH }}
          tag_name: blobs-${{ github.event.inputs.DEVICE_PATH }}-${{ github.run_id }}
          body: |
            ## Vendor blobs for ${{ github.event.inputs.VENDOR_NAME }} ${{ github.event.inputs.DEVICE_PATH }}

            Extracted from stock firmware via GitHub Actions.

            ### Contents:
            - `vendor_${{ github.event.inputs.DEVICE_PATH }}.zip` — All vendor blobs
            - `proprietary-files.txt` — File list
            - `${{ github.event.inputs.DEVICE_PATH }}-vendor.mk` — Vendor makefile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
